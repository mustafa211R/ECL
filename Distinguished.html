<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<title>الطلبة المتميزون | مختبر فيزياء</title>
<meta name="description" content="الطلبة المتميزون في مختبر فيزياء: تجاربهم وصورهم وتقاريرهم. جزء من منصة طالب.">
 <link href="cairo.css" rel="stylesheet">
  <script src="node_modules/chart.js/dist/chart.umd.js"></script>    
  <!-- أيقونات Font Awesome (webfonts) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  color-scheme:dark light;
  --bg:#070b18;--orb1:#1d4ed8;--orb2:#7c3aed;--orb3:#0891b2;--orbop:.5;
  --glass:rgba(28,36,68,.55);--glass-b:rgba(255,255,255,.12);
  --txt:#f4f6ff;--mut:#9aa5c6;
  --sheet:rgba(15,20,38,.92);--cell:rgba(255,255,255,.06);--cell-b:rgba(255,255,255,.08);
  --acc:#0a84ff;--ok:#30d158;--warn:#ff9f0a;--bad:#ff453a;--gold:#ffd60a;
  --shadow:0 20px 60px rgba(0,0,0,.45);
  --ease:cubic-bezier(.32,.72,0,1);
}
@media(prefers-color-scheme:light){
  :root{--bg:#eef1f8;--orb1:#93c5fd;--orb2:#c4b5fd;--orb3:#99f6e4;--orbop:.65;
    --glass:rgba(255,255,255,.66);--glass-b:rgba(255,255,255,.95);
    --txt:#0f1530;--mut:#5b6486;
    --sheet:rgba(246,248,253,.94);--cell:rgba(255,255,255,.9);--cell-b:rgba(15,21,48,.06);
    --shadow:0 20px 50px rgba(30,40,90,.18);--gold:#e5a400}
}
body{font-family:'IBM Plex Sans Arabic',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--bg);color:var(--txt);
  min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:opacity .16s,transform .16s}
body.lock{overflow:hidden}
body.leaving{opacity:0;transform:scale(.985)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:3px;border-radius:12px}

.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:var(--orbop);pointer-events:none;z-index:0}
.o1{width:380px;height:380px;background:var(--orb1);top:-120px;right:-100px;animation:float 18s ease-in-out infinite}
.o2{width:340px;height:340px;background:var(--orb2);top:45%;left:-140px;animation:float 22s ease-in-out infinite reverse}
.o3{width:300px;height:300px;background:var(--orb3);bottom:-100px;right:10%;animation:float 20s ease-in-out infinite}
@keyframes float{50%{transform:translate(30px,40px) scale(1.08)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}

.app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 20px calc(60px + env(safe-area-inset-bottom))}
.glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);box-shadow:var(--shadow)}

/* الشريط العلوي */
.topbar{display:flex;align-items:center;justify-content:space-between;animation:rise .6s var(--ease) both}
.back{display:inline-flex;align-items:center;gap:8px;padding:9px 16px 9px 14px;border-radius:99px;font-size:14px;font-weight:600;color:var(--acc);transition:transform .25s var(--ease)}
.back:active{transform:scale(.94)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;font-size:12.5px;font-weight:600}
.pill i{color:var(--ok);font-size:8px}

h1.large{font-size:clamp(34px,9vw,44px);font-weight:700;letter-spacing:-.5px;margin:24px 0 6px;line-height:1.2;animation:rise .6s .05s var(--ease) both}
h1.large span{background:linear-gradient(120deg,#ffd60a,#ff9f0a 55%,#ff375f);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--mut);font-size:15px;line-height:1.8;animation:rise .6s .1s var(--ease) both}

/* بطاقة التقدير */
.hero{margin-top:22px;padding:20px;border-radius:28px;display:flex;align-items:center;gap:16px;position:relative;overflow:hidden;animation:rise .6s .15s var(--ease) both}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 120% at 100% 0%,rgba(255,214,10,.22),transparent 60%);pointer-events:none}
.trophy{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:28px;color:#fff;flex:none;position:relative;
  background:linear-gradient(145deg,#ffd60a,#ff9f0a);box-shadow:0 12px 26px rgba(255,159,10,.4),inset 0 0 0 1px rgba(255,255,255,.3)}
.hero b{font-size:16px;display:block;position:relative}
.hero p{font-size:13px;color:var(--mut);line-height:1.8;margin-top:3px;position:relative}
.stats{display:flex;gap:18px;margin-top:10px;position:relative}
.stats div{font-size:11.5px;color:var(--mut)}
.stats strong{display:block;font-size:22px;color:var(--txt);line-height:1.1}

/* البحث */
.search{display:flex;align-items:center;gap:10px;margin-top:18px;padding:0 16px;height:50px;border-radius:16px;animation:rise .6s .2s var(--ease) both}
.search i{color:var(--mut)}
.search input{flex:1;height:100%;background:none;border:0;outline:0;color:var(--txt);font:inherit;font-size:15px}
.search input::placeholder{color:var(--mut)}
.search .clr{display:none;width:22px;height:22px;border-radius:50%;background:var(--mut);color:var(--bg);place-items:center;font-size:11px;opacity:.7}
.search.has .clr{display:grid}

/* بطاقات الطلاب */
.grid{display:grid;gap:16px;margin-top:20px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.s-card{border-radius:26px;overflow:hidden;text-align:start;display:flex;flex-direction:column;transition:transform .35s var(--ease),border-color .3s;
  background:var(--cell);border:1px solid var(--cell-b);box-shadow:var(--shadow);animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*70ms + .25s)}
.s-card:hover{transform:translateY(-4px)}
.s-card:active{transform:scale(.98)}
.s-top{display:flex;align-items:center;gap:14px;padding:16px 16px 12px}
.av{width:62px;height:62px;border-radius:50%;padding:2.5px;flex:none;position:relative;background:conic-gradient(from 200deg,#ffd60a,#ff9f0a,#ff375f,#ffd60a)}
.av img,.av .fb{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2.5px solid var(--bg)}
.av .fb{position:absolute;inset:2.5px;width:auto;height:auto;display:grid;place-items:center;background:#1b2347;color:#fff;font-size:22px;font-weight:700}
.av img{position:relative;z-index:1}
.s-id{font-size:11.5px;color:var(--mut)}
.s-name{font-size:16.5px;font-weight:700;margin-top:1px}
.rank{margin-inline-start:auto;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(145deg,#ffd60a,#ff9f0a);flex:none}
.thumb{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#1b2347,#0f1530);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease)}
.s-card:hover .thumb img{transform:scale(1.06)}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:34px;opacity:.5}
.thumb img{position:relative;z-index:1}
.thumb::after{content:"";position:absolute;inset:auto 0 0 0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,.5));z-index:2}
.thumb .tag{position:absolute;z-index:3;bottom:10px;inset-inline-start:12px;font-size:12px;font-weight:600;color:#fff;display:flex;align-items:center;gap:6px}
.s-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;flex:1}
.exp-name{font-size:15px;font-weight:700;color:var(--gold)}
.exp-desc{font-size:13px;line-height:1.85;color:var(--mut);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more{margin-top:auto;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--acc)}
.empty{display:none;text-align:center;padding:50px 20px;color:var(--mut);font-size:14px;line-height:2}
.empty i{font-size:34px;display:block;margin-bottom:10px;opacity:.6}

/* النافذة المنبثقة */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(2,6,16,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .4s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:50;bottom:0;left:50%;width:min(100%,680px);height:min(92dvh,880px);
  transform:translate(-50%,105%);visibility:hidden;transition:transform .55s var(--ease),visibility 0s .55s;
  background:var(--sheet);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);
  border:1px solid var(--glass-b);border-bottom:0;border-radius:32px 32px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.4);display:flex;flex-direction:column}
.sheet.open{transform:translate(-50%,0);visibility:visible;transition:transform .55s var(--ease),visibility 0s}
.sh-head{padding:8px 20px 10px;touch-action:none;cursor:grab;flex:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--mut);opacity:.4;margin:0 auto 10px}
.sh-title{display:flex;align-items:center;justify-content:space-between}
.sh-title span{font-size:13px;color:var(--mut);font-weight:600}
.x{width:34px;height:34px;border-radius:50%;background:var(--cell);border:1px solid var(--cell-b);display:grid;place-items:center;color:var(--mut)}
.x:active{transform:scale(.85)}
.sh-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 20px calc(30px + env(safe-area-inset-bottom));scrollbar-width:none}
.sh-body::-webkit-scrollbar{display:none}
.d-view{animation:rise .5s var(--ease) both}
.d-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.d-head .av{width:76px;height:76px}
.d-head h2{font-size:21px;font-weight:700}
.d-head small{color:var(--mut);font-size:12.5px}
.d-img{width:100%;border-radius:22px;overflow:hidden;background:#0f1530;border:1px solid var(--cell-b);position:relative;min-height:160px;cursor:zoom-in}
.d-img img{width:100%;display:block;max-height:50dvh;object-fit:contain;position:relative;z-index:1}
.d-img .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:40px;opacity:.4}
.d-card{margin-top:14px;padding:16px;border-radius:22px;background:var(--cell);border:1px solid var(--cell-b)}
.d-card h3{font-size:12.5px;color:var(--mut);font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.d-card h4{font-size:17px;font-weight:700;color:var(--gold);margin-bottom:6px}
.d-card p{font-size:14px;line-height:1.95;color:var(--txt);opacity:.9}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:14px 10px;border-radius:16px;font-size:14px;font-weight:600;color:#fff;transition:transform .2s var(--ease),filter .2s}
.btn:active{transform:scale(.95)}
.btn[aria-disabled=true]{opacity:.4;pointer-events:none}
.b-view{background:linear-gradient(145deg,#bf5af2,#5e5ce6);grid-column:1/-1;font-size:15px;padding:16px}
.b-pdf{background:linear-gradient(145deg,#ff6961,#ff375f)}
.b-img{background:linear-gradient(145deg,#5ac8fa,#0a84ff)}
.nopdf{grid-column:1/-1;text-align:center;font-size:12.5px;color:var(--mut)}

/* عرض الصورة بملء الشاشة */
.lb{position:fixed;inset:0;z-index:80;background:rgba(3,6,14,.94);backdrop-filter:blur(10px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.lb.open{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.lb img{max-width:94vw;max-height:78dvh;border-radius:16px;object-fit:contain;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.lb .cap{color:#e9eeff;text-align:center;font-size:14px;line-height:1.8}
.lb .cap b{color:var(--gold);display:block;font-size:17px}
.lb .x{position:absolute;top:calc(env(safe-area-inset-top) + 16px);inset-inline-start:18px;background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)}

.toast{position:fixed;z-index:90;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;pointer-events:none;
  padding:11px 20px;border-radius:99px;font-size:13.5px;font-weight:600;transition:.4s var(--ease);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{margin-top:40px;text-align:center;font-size:12px;color:var(--mut);line-height:2}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<main class="app">
  <div class="topbar">
    <a class="glass back" href="index.html" id="backBtn"><i class="fa-solid fa-chevron-right"></i> الرئيسية</a>
    <div class="glass pill"><i class="fa-solid fa-circle"></i> مختبر فيزياء</div>
  </div>

  <h1 class="large">الطلبة <span>المتميزون</span></h1>
  <p class="lead">تجارب أبدعها طلبتنا داخل المختبر، بصورها وشروحها وتقاريرها.</p>

  <section class="glass hero" aria-label="ملخص">
    <div class="trophy"><i class="fa-solid fa-trophy"></i></div>
    <div>
      <b>لوحة التميّز</b>
      <p>اضغط على أي بطاقة لعرض التجربة كاملة وتحميل التقرير.</p>
      <div class="stats">
        <div><strong id="stStud">0</strong>طلاب</div>
        <div><strong id="stPdf">0</strong>تقارير PDF</div>
      </div>
    </div>
  </section>

  <label class="glass search" id="searchBox">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input id="q" type="search" placeholder="ابحث باسم الطالب أو التجربة أو رقمه" autocomplete="off" aria-label="بحث">
    <button class="clr" id="clr" aria-label="مسح البحث" type="button"><i class="fa-solid fa-xmark"></i></button>
  </label>

  <section class="grid" id="grid" aria-live="polite"></section>
  <div class="empty" id="empty"><i class="fa-regular fa-face-meh"></i>لا توجد نتائج مطابقة لبحثك.</div>

  <footer id="foot"></footer>
</main>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="تفاصيل التجربة" aria-hidden="true">
  <div class="sh-head" id="shHead">
    <div class="grab"></div>
    <div class="sh-title"><span>تفاصيل التجربة</span><button class="x" id="closeBtn" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button></div>
  </div>
  <div class="sh-body" id="sBody"></div>
</section>

<div class="lb" id="lb" role="dialog" aria-label="عرض الصورة">
  <button class="x" id="lbClose" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button>
  <img id="lbImg" alt="">
  <div class="cap"><b id="lbName"></b><span id="lbExp"></span></div>
</div>

<div class="toast glass" id="toast" role="status"></div>

<script src="db.js"></script>
<script>
const $ = (s,r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const buzz = () => { try{ navigator.vibrate && navigator.vibrate(8); }catch(e){} };
const hasPdf = s => !!(s.expPdf && s.expPdf.trim());
const safe = s => String(s||'').replace(/[\\/:*?"<>|]+/g,'_').slice(0,60);
const ini = n => (String(n||'').trim()[0] || '؟');

let tt;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2400); }

/* ===== الإحصائيات والتذييل ===== */
$('#stStud').textContent = STUDENTS.length;
$('#stPdf').textContent = STUDENTS.filter(hasPdf).length;
$('#foot').innerHTML = `${esc(PROJECT.name)} • ${esc(PROJECT.school)}<br>إعداد المبرمج ${esc(TEACHERS[0].name)} • إشراف ${esc(TEACHERS[1].name)}`;

/* ===== عرض البطاقات ===== */
const grid = $('#grid');
function avatar(s){
  return `<div class="av"><div class="fb">${esc(ini(s.name))}</div><img src="${esc(s.studentPhoto)}" alt="صورة الطالب ${esc(s.name)}" loading="lazy" onerror="this.remove()"></div>`;
}
function render(list){
  grid.innerHTML = list.map(({s,i}) => `
    <button class="s-card" data-i="${i}" style="--i:${i}" aria-label="${esc(s.name)} — ${esc(s.expName)}">
      <div class="s-top">
        ${avatar(s)}
        <div><div class="s-id">رقم الطالب: ${esc(s.id)}</div><div class="s-name">${esc(s.name)}</div></div>
        <div class="rank">${i+1}</div>
      </div>
      <div class="thumb">
        <div class="ph"><i class="fa-solid fa-bolt"></i></div>
        <img src="${esc(s.expPhoto)}" alt="${esc(s.expName)}" loading="lazy" onerror="this.remove()">
        <div class="tag"><i class="fa-solid fa-flask"></i> ${esc(s.expName)}</div>
      </div>
      <div class="s-body">
        <div class="exp-desc">${esc(s.expDesc)}</div>
        <span class="more">عرض التجربة <i class="fa-solid fa-chevron-left"></i></span>
      </div>
    </button>`).join('');
  $('#empty').style.display = list.length ? 'none' : 'block';
}
const all = STUDENTS.map((s,i) => ({s,i}));
render(all);

/* ===== البحث ===== */
const q = $('#q');
q.addEventListener('input', () => {
  const v = q.value.trim().toLowerCase();
  $('#searchBox').classList.toggle('has', !!v);
  render(all.filter(({s}) => [s.name,s.expName,s.id,s.expDesc].join(' ').toLowerCase().includes(v)));
});
$('#clr').onclick = () => { q.value=''; q.dispatchEvent(new Event('input')); q.focus(); };

/* ===== النافذة المنبثقة ===== */
const sheet = $('#sheet'), scrim = $('#scrim'), sBody = $('#sBody');
let isOpen = false, cur = null;
function openSheet(i){
  const s = STUDENTS[i]; cur = s;
  const p = hasPdf(s);
  sBody.innerHTML = `<div class="d-view">
    <div class="d-head">${avatar(s)}<div><h2>${esc(s.name)}</h2><small>رقم الطالب: ${esc(s.id)} • ${esc(PROJECT.school)}</small></div></div>
    <div class="d-img" id="dImg" title="اضغط للتكبير">
      <div class="ph"><i class="fa-solid fa-bolt"></i></div>
      <img src="${esc(s.expPhoto)}" alt="${esc(s.expName)}" onerror="this.remove()">
    </div>
    <div class="d-card">
      <h3><i class="fa-solid fa-flask"></i> التجربة</h3>
      <h4>${esc(s.expName)}</h4>
      <p>${esc(s.expDesc)}</p>
    </div>
    <div class="acts">
      <a class="btn b-view" ${p?`href="${esc(s.expPdf)}" target="_blank" rel="noopener"`:''} aria-disabled="${!p}"><i class="fa-solid fa-eye"></i> عرض التقرير PDF</a>
      <a class="btn b-pdf" ${p?`href="${esc(s.expPdf)}" download`:''} aria-disabled="${!p}"><i class="fa-solid fa-file-pdf"></i> تحميل PDF</a>
      <a class="btn b-img" href="${esc(s.expPhoto)}" download="${esc(safe(s.name)+'_'+safe(s.expName))}.jpg"><i class="fa-solid fa-image"></i> تحميل الصورة</a>
      ${p?'':'<div class="nopdf">لم يُرفع ملف PDF لهذا الطالب بعد.</div>'}
    </div>
  </div>`;
  sBody.scrollTop = 0;
  $('#dImg').onclick = () => openLB(s);
  sBody.querySelectorAll('.btn:not([aria-disabled=true])').forEach(b => b.addEventListener('click', buzz));
  if(!isOpen){
    isOpen = true;
    try{ history.pushState({s:1},''); }catch(e){}
    sheet.classList.add('open'); scrim.classList.add('open');
    sheet.setAttribute('aria-hidden','false'); document.body.classList.add('lock');
  }
}
function visualClose(){
  if(!isOpen) return;
  isOpen = false; sheet.classList.remove('open'); scrim.classList.remove('open');
  sheet.setAttribute('aria-hidden','true'); document.body.classList.remove('lock');
}
function closeSheet(){
  if(!isOpen) return;
  if(history.state && history.state.s) history.back(); else visualClose();
}
window.addEventListener('popstate', () => { closeLB(); visualClose(); });
grid.addEventListener('click', e => { const c = e.target.closest('.s-card'); if(c){ buzz(); openSheet(+c.dataset.i); } });
$('#closeBtn').onclick = () => { buzz(); closeSheet(); };
scrim.onclick = closeSheet;

/* سحب النافذة للأسفل */
(function(){
  const head = $('#shHead'); let d = null;
  head.addEventListener('pointerdown', e => { if(e.target.closest('.x')) return; d={y:e.clientY,t:performance.now(),dy:0}; head.setPointerCapture(e.pointerId); sheet.style.transition='none'; });
  head.addEventListener('pointermove', e => { if(!d) return; d.dy=Math.max(0,e.clientY-d.y); sheet.style.transform=`translate(-50%,${d.dy}px)`; });
  const end = () => { if(!d) return; const v=d.dy/Math.max(1,performance.now()-d.t); sheet.style.transition=''; sheet.style.transform=''; if(d.dy>120||v>.6) closeSheet(); d=null; };
  head.addEventListener('pointerup', end); head.addEventListener('pointercancel', end);
})();

/* ===== عرض الصورة مكبّرة ===== */
const lb = $('#lb');
function openLB(s){
  $('#lbImg').src = s.expPhoto; $('#lbImg').alt = s.expName;
  $('#lbName').textContent = s.name; $('#lbExp').textContent = `${s.expName} — رقم الطالب: ${s.id}`;
  lb.classList.add('open');
}
function closeLB(){ lb.classList.remove('open'); }
$('#lbClose').onclick = closeLB;
lb.addEventListener('click', e => { if(e.target === lb) closeLB(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ lb.classList.contains('open') ? closeLB() : closeSheet(); } });

/* ===== الرجوع للرئيسية بانتقال ناعم ===== */
$('#backBtn').addEventListener('click', e => {
  e.preventDefault(); buzz(); document.body.classList.add('leaving');
  setTimeout(() => { location.href = 'index.html'; }, 170);
});
</script>
