<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0d1620">
    <title>مختبر الفيزياء الافتراضي — الثاني المتوسط</title>
 <link href="cairo.css" rel="stylesheet">
  <script src="node_modules/chart.js/dist/chart.umd.js"></script> 
     <style>   
        :root {
            --bg: #e9eef4;
            --pn: #fff;
            --ln: #d3dbe4;
            --tx: #16202a;
            --mu: #586a7a;
            --bt: #e4ebf2;
            --bh: #d2dde9;
            --in: #f1f5f9;
            --ac: #9a5b00;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0d1620;
                --pn: #111b26;
                --ln: #2a3b4c;
                --tx: #e3ecf3;
                --mu: #9fb4c7;
                --bt: #22364a;
                --bh: #2d4b68;
                --in: #0a1119;
                --ac: #ffc94d
            }
        }

        :root[data-theme="dark"] {
            --bg: #0d1620;
            --pn: #111b26;
            --ln: #2a3b4c;
            --tx: #e3ecf3;
            --mu: #9fb4c7;
            --bt: #22364a;
            --bh: #2d4b68;
            --in: #0a1119;
            --ac: #ffc94d
        }

        * {
            box-sizing: border-box
        }

        html {
            background: var(--bg);
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        html,
        body {
            height: 100%
        }

        body {
            margin: 0;
            font-family: Cairo, sans-serif;
            background: var(--bg);
            color: var(--tx);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent
        }

        header {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 8px 12px;
            background: var(--pn);
            border-bottom: 1px solid var(--ln);
            flex-wrap: wrap
        }

        header h1 {
            font-size: 17px;
            margin: 0 8px 0 0;
            color: var(--ac)
        }

        #tools {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        button,
        select,
        input,
        textarea {
            font: inherit
        }

        button,
        select {
            background: var(--bt);
            color: var(--tx);
            border: 1px solid var(--ln);
            border-radius: 8px;
            padding: 5px 11px;
            cursor: pointer;
            touch-action: manipulation
        }

        button:hover {
            background: var(--bh)
        }

        button.on {
            background: #1c8a4e;
            border-color: #2fbf74;
            color: #fff
        }

        #nav {
            display: none
        }

        main {
            flex: 1;
            display: flex;
            min-height: 0;
            position: relative
        }

        #pal {
            width: 150px;
            overflow: auto;
            padding: 8px;
            background: var(--pn);
            border-left: 1px solid var(--ln)
        }

        .pi {
            background: var(--in);
            border: 2px solid var(--ln);
            border-radius: 8px;
            margin-bottom: 7px;
            padding: 3px;
            text-align: center;
            font-size: 12px;
            cursor: pointer
        }

        .pi.sel {
            border-color: #4ea8ff
        }

        .pi svg {
            width: 100%;
            height: 52px;
            display: block
        }

        #stg {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            position: relative
        }

        #sv {
            flex: 1;
            min-height: 0;
            width: 100%;
            background: var(--bg)
        }

        #vt {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 5;
            display: flex;
            gap: 6px
        }

        #acts {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding: 6px 8px;
            background: var(--pn);
            border-top: 1px solid var(--ln);
            min-height: 46px;
            align-items: center
        }

        #hcard {
            position: absolute;
            left: 8px;
            right: 8px;
            bottom: 60px;
            z-index: 6;
            background: var(--pn);
            border: 1px solid var(--ln);
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 6px 24px #0006;
            display: none;
            font-size: 14px;
            line-height: 1.7
        }

        #hcard.show {
            display: block
        }

        #side {
            width: 390px;
            overflow: auto;
            padding: 10px;
            background: var(--pn);
            border-right: 1px solid var(--ln)
        }

        #side h3 {
            margin: 4px 0 8px;
            font-size: 15px;
            color: var(--ac)
        }

        .rd {
            margin: 8px 0;
            padding: 8px;
            background: var(--in);
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.75
        }

        .rd ol,
        .rd ul {
            margin: 4px 0;
            padding-right: 20px
        }

        .fm {
            direction: ltr;
            text-align: left;
            font-size: 13px;
            color: var(--mu)
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--mu);
            margin-top: 8px
        }

        #side input[type=number],
        #side input[type=text],
        #side select,
        #side textarea {
            width: 100%;
            background: var(--in);
            color: var(--tx);
            border: 1px solid var(--ln);
            border-radius: 6px;
            padding: 4px 6px
        }

        input[type=range] {
            width: 100%
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 6px
        }

        th,
        td {
            padding: 4px;
            border-bottom: 1px solid var(--ln);
            text-align: center
        }

        #tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 8px
        }

        #tabs button {
            flex: 1;
            padding: 5px 2px;
            font-size: 13px
        }

        .sec {
            display: none
        }

        body[data-tab=e] .sec[data-s=e],
        body[data-tab=m] .sec[data-s=m],
        body[data-tab=c] .sec[data-s=c],
        body[data-tab=t] .sec[data-s=t] {
            display: block
        }

        .hs {
            animation: pl 1.6s infinite
        }

        @keyframes pl {
            50% {
                opacity: .6
            }
        }

        #md {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #000b;
            display: none;
            align-items: center;
            justify-content: center;
            padding: calc(env(safe-area-inset-top, 0px) + 8px) 8px 8px
        }

        #md.show {
            display: flex
        }

        #md .box {
            background: var(--pn);
            border: 1px solid var(--ln);
            border-radius: 14px;
            max-width: 900px;
            width: 100%;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        #md .hd {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid var(--ln)
        }

        #mdb {
            padding: 12px;
            overflow: auto
        }

        .paper {
            background: #fff;
            color: #111;
            padding: 18px;
            border-radius: 8px;
            line-height: 1.8;
            font-size: 14px
        }

        .paper h2 {
            margin: 0 0 4px;
            color: #0b3d6b
        }

        .paper h3 {
            margin: 12px 0 4px;
            color: #0b3d6b;
            border-bottom: 2px solid #0b3d6b
        }

        .paper table {
            font-size: 12.5px
        }

        .paper th,
        .paper td {
            border: 1px solid #aab;
            color: #111
        }

        .paper th {
            background: #e6eefb
        }

        @media print {
            body>*:not(#md) {
                display: none !important
            }

            html,
            body {
                height: auto;
                overflow: visible;
                background: #fff
            }

            #md {
                position: static;
                display: block;
                background: none;
                padding: 0
            }

            #md .box {
                border: 0;
                max-height: none;
                overflow: visible
            }

            #md .hd,
            .noprint {
                display: none !important
            }

            #mdb {
                padding: 0;
                overflow: visible
            }
        }

        @media(pointer:coarse) {

            button,
            select {
                min-height: 40px
            }
        }

        @media(max-width:899px) {
            header {
                padding: 6px 10px
            }

            header h1 {
                font-size: 15px
            }

            #st {
                order: 9;
                width: 100%;
                font-size: 12px;
                color: var(--mu)
            }

            #tools {
                display: none;
                position: fixed;
                top: calc(env(safe-area-inset-top, 0px) + 52px);
                left: 8px;
                right: 8px;
                z-index: 50;
                background: var(--pn);
                border: 1px solid var(--ln);
                border-radius: 14px;
                padding: 10px;
                box-shadow: 0 8px 30px #0008;
                grid-template-columns: 1fr 1fr
            }

            body.s-menu #tools {
                display: grid
            }

            #tools select,
            #tools button {
                width: 100%
            }

            #pal,
            #side {
                position: fixed;
                left: 0;
                right: 0;
                bottom: calc(58px + env(safe-area-inset-bottom, 0px));
                width: auto;
                border: 0;
                border-top: 1px solid var(--ln);
                z-index: 30;
                transform: translateY(130%);
                visibility: hidden;
                transition: transform .2s, visibility .2s;
                box-shadow: 0 -6px 24px #0007
            }

            #pal {
                display: flex;
                gap: 8px;
                overflow-x: auto;
                padding: 8px
            }

            .pi {
                flex: 0 0 96px;
                margin: 0
            }

            #side {
                max-height: 60%;
                border-radius: 16px 16px 0 0
            }

            body.s-pal #pal,
            body.s-side #side {
                transform: none;
                visibility: visible
            }

            #nav {
                display: flex;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                z-index: 40;
                background: var(--pn);
                border-top: 1px solid var(--ln);
                padding-bottom: env(safe-area-inset-bottom, 0px)
            }

            #nav button {
                flex: 1;
                height: 58px;
                border: 0;
                border-radius: 0;
                background: none;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                font-size: 20px;
                line-height: 1.2
            }

            #nav button span {
                font-size: 11px;
                color: var(--mu)
            }

            #nav button.act span {
                color: var(--ac);
                font-weight: 700
            }

            #hcard {
                bottom: calc(120px + env(safe-area-inset-bottom, 0px))
            }

            #acts {
                margin-bottom: calc(58px + env(safe-area-inset-bottom, 0px))
            }
        }
    </style>
</head>

    <script>
        const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
        const cl = (x, a, b) => Math.max(a, Math.min(b, x)), lerp = (a, b, t) => a + (b - a) * t, f1 = (x, d = 1) => (+x).toFixed(d);
        const hx = c => [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16)), mix = (a, b, t) => { const x = hx(a), y = hx(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join('') };
        const hcol = t => { t = cl(t, 0, 1); return t < .5 ? mix('#3b82f6', '#ffd84a', t * 2) : mix('#ffd84a', '#ef4444', (t - .5) * 2) };
        const R = (x, y, w, h, f, e = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${e}/>`, Cc = (x, y, r, f, e = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${e}/>`, Ln = (a, b, c, d, s = '#345', w = 2, e = '') => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${s}" stroke-width="${w}" ${e}/>`, Tx = (x, y, t, z = 13, f = '#223', a = 'middle', e = '') => `<text x="${x}" y="${y}" font-size="${z}" fill="${f}" text-anchor="${a}" ${e}>${t}</text>`;
        const PLN = { earth: { n: 'الأرض', g: 9.8, col: '#4f9de0' }, moon: { n: 'القمر', g: 1.62, col: '#b8b8b8' }, mars: { n: 'المريخ', g: 3.71, col: '#d9744a' }, jup: { n: 'المشتري', g: 24.8, col: '#d9b08a' } };
        const MED = { air: { n: 'هواء', x: 1.0003, col: '#e8f4ff' }, water: { n: 'ماء', x: 1.33, col: '#4ea8ff' }, oil: { n: 'زيت', x: 1.47, col: '#e8c13a' }, glass: { n: 'زجاج', x: 1.52, col: '#9fd0d8' }, diamond: { n: 'ألماس', x: 2.42, col: '#cfe9ff' } };
        const SND = { air: { n: 'هواء', x: 343 }, water: { n: 'ماء', x: 1480 }, wood: { n: 'خشب', x: 3850 }, iron: { n: 'حديد', x: 5120 } };
        const CT = [['تسارع الجاذبية g (m/s²)', PLN, 'g'], ['معامل الانكسار n', MED, 'x'], ['سرعة الصوت (m/s)', SND, 'x']];
        const opt = o => () => Object.entries(o).map(([k, v]) => [k, v.n]);
        function kid(x, y, s, o) {
            const c = Object.assign({ sh: '#3b82f6', pt: '#44506a', hr: '#3b2314', sk: '#f2c9a0', f: 1, a1: 15, a2: -15, l1: 8, l2: -8, al: 1 }, o || {});
            const lb = (x0, y0, a, l, w, col, hc) => { const r = a * Math.PI / 180, x1 = x0 + Math.sin(r) * l, y1 = y0 + Math.cos(r) * l; return Ln(x0, y0, x1, y1, col, w, 'stroke-linecap="round"') + Cc(x1, y1, w / 2 + 1, hc) };
            return `<g opacity="${c.al}" transform="translate(${x} ${y}) scale(${s * c.f} ${s})">` + lb(-3, -44, c.l2, 42, 9, c.pt, '#222') + lb(0, -80, c.a2, 32, 7, c.sh, c.sk) + R(-12, -86, 24, 44, c.sh, 'rx="9"') + lb(3, -44, c.l1, 42, 9, c.pt, '#222') + lb(0, -80, c.a1, 32, 7, c.sh, c.sk) + Cc(0, -102, 15, c.sk, 'stroke="#c9996a" stroke-width="1"') + `<path d="M-15 -103Q-16 -121 0 -121Q16 -121 15 -103Q8 -110 -3 -108Q-10 -108 -15 -103Z" fill="${c.hr}"/>` + Cc(5, -102, 2, '#222') + Cc(11, -102, 2, '#222') + `<path d="M5 -95Q9 -91 13 -95" fill="none" stroke="#a0522d" stroke-width="2" stroke-linecap="round"/></g>`
        }
        const arr = (x1, y1, x2, y2, c = '#e5484d', w = 4) => { const a = Math.atan2(y2 - y1, x2 - x1), h = 10; return Ln(x1, y1, x2, y2, c, w) + `<polygon points="${x2},${y2} ${x2 - h * Math.cos(a - .4)},${y2 - h * Math.sin(a - .4)} ${x2 - h * Math.cos(a + .4)},${y2 - h * Math.sin(a + .4)}" fill="${c}"/>` };
        const sw = (x, y, t) => Cc(x, y, 24, '#fff', 'stroke="#456" stroke-width="3"') + R(x - 4, y - 32, 8, 8, '#456') + Ln(x, y, x + Math.sin(t * .10472) * 18, y - Math.cos(t * .10472) * 18, '#e5484d', 2) + Tx(x, y + 42, f1(t, 2) + ' s', 13, '#c22');
        const sb = (x, y, F, mx = 10) => { const p = x + 10 + cl(F / mx, 0, 1) * 65; return R(x, y - 11, 86, 22, '#eef2f7', 'stroke="#456" stroke-width="2" rx="6"') + Ln(x + 10, y, x + 75, y, '#9ab', 1) + Ln(p, y - 10, p, y + 10, '#e5484d', 3) + Tx(x + 43, y + 26, f1(F) + ' N', 12, '#c22') };

        function recT() { const r = rows[X.id] || []; $('#rows').innerHTML = r.length ? `<table><tr>${X.rh.map(h => `<th>${h}</th>`).join('')}</tr>${r.map(x => `<tr>${x.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table>` : '<div class="rd">لا قراءات مسجّلة بعد.</div>' }
        $('#rc').onclick = () => { rows[X.id].push(...X.rec()); recT() }; $('#rcx').onclick = () => { rows[X.id] = []; recT() }; $('#nt').oninput = e => notes[X.id] = e.target.value;
        function ui() { $('#rdg').innerHTML = '<table>' + X.read().map(([a, b]) => `<tr><td>${a}</td><td><b>${b}</b></td></tr>`).join('') + '</table>'; $('#st').textContent = (run ? '● يعمل' : '○ متوقف') + ' — ' + ENV[envK].n; syncC(); acts() }
        function closeSheets() { document.body.classList.remove('s-pal', 's-side', 's-menu'); $$('#nav button').forEach(b => b.classList.remove('act')) }
        $$('#nav [data-n]').forEach(b => b.onclick = () => { const k = 's-' + b.dataset.n, on = document.body.classList.contains(k); closeSheets(); if (!on) { document.body.classList.add(k); b.classList.add('act') } });
        $$('#tabs [data-t]').forEach(b => b.onclick = () => document.body.dataset.tab = b.dataset.t);
        $('#ex').innerHTML = [1, 2, 3, 4].map(c => `<optgroup label="${CH[c]}">` + EX.filter(e => e.ch == c).map(e => `<option value="${e.id}">${e.n}</option>`).join('') + '</optgroup>').join('');
        $('#ex').onchange = e => { load(e.target.value); view = 'exp'; vt(); closeSheets() };
        $('#ev').innerHTML = Object.entries(ENV).map(([k, e]) => `<option value="${k}">${e.n}</option>`).join(''); $('#ev').onchange = e => { envK = e.target.value; hot = null; $('#hcard').classList.remove('show'); closeSheets() };
        $('#sp').onchange = e => spd = +e.target.value;
        $('#run').onclick = () => { run = !run; $('#run').textContent = run ? '⏸ إيقاف' : '▶ تشغيل'; $('#run').classList.toggle('on', run) };
        $('#rst').onclick = () => load(X.id);
        function vt() { $$('#vt button').forEach(b => b.classList.toggle('on', b.dataset.v == view)); $('#hcard').classList.remove('show') }
        $$('#vt button').forEach(b => b.onclick = () => { view = b.dataset.v; vt() });
        $('#s-e').addEventListener('click', e => { const g = e.target.dataset.go; if (g) { envK = g; $('#ev').value = g; view = 'env'; vt(); closeSheets() } });
        $('#sv').addEventListener('pointerdown', e => { const g = e.target.closest('[data-h]'); if (!g) return; const h = ENV[envK].hs[+g.dataset.h], ex = EX.find(x => x.id == h[5]); hot = h; $('#hcard').innerHTML = `<b>${h[2]} ${h[3]}</b><br>${h[4]}<br><button id="hg">🔬 جرّب: ${ex.n}</button> <button id="hx">✕</button>`; $('#hcard').classList.add('show') });
        $('#hcard').addEventListener('click', e => { if (e.target.id == 'hx') $('#hcard').classList.remove('show'); if (e.target.id == 'hg' && hot) { load(hot[5]); view = 'exp'; vt(); closeSheets() } });
        function modal(t, h) { $('#mdt').textContent = t; $('#mdb').innerHTML = h; $('#md').classList.add('show') } $('#mdx').onclick = () => $('#md').classList.remove('show');
        $('#rp').onclick = () => { closeSheets(); const r = rows[X.id] || []; modal('📄 تقرير التجربة', `<div class="noprint"><button onclick="window.print()">🖨 طباعة / حفظ PDF</button> <span style="font-size:12px;color:var(--mu)">يمكنك تعديل النص داخل الورقة البيضاء قبل الطباعة.</span></div><div class="paper" contenteditable="true"><h2>${X.n}</h2><div>${CH[X.ch]} — الطالب: ............ الصف: ......... التاريخ: ${new Date().toLocaleDateString('ar-IQ')}</div><h3>الهدف</h3>${X.goal}<h3>الفائدة والغرض</h3>${X.why}<h3>الأدوات</h3>${X.tools.map(t => t[0] + ': ' + t[2]).join('<br>')}<h3>الطريقة</h3><ol>${X.steps.map(s => `<li>${s}</li>`).join('')}</ol><h3>القانون</h3><div dir="ltr">${X.law}</div><h3>القياسات والنتائج</h3>${r.length ? `<table><tr>${X.rh.map(h => `<th>${h}</th>`).join('')}</tr>${r.map(x => `<tr>${x.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table>` : '<p>لم تُسجَّل قراءات.</p>'}<h3>القراءات الحالية</h3><table>${X.read().map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table><h3>الاستنتاج</h3>${notes[X.id] || X.concl}</div>`) };
        /* ===== الحلقة الرئيسية ===== */
        let last = performance.now();
        function loop(now) {
            const dt = Math.min(.05, (now - last) / 1000 || .016); last = now; let s;
            if (view == 'exp') { if (run && X.tick) X.tick(dt, dt * spd); s = ENV[envK].d() + R(10, 10, 780, 460, '#f6f9fc', 'rx="18" opacity=".92"') + X.draw() }
            else s = ENV[envK].d() + ENV[envK].hs.map((h, i) => `<g class="hs" data-h="${i}" style="cursor:pointer"><circle cx="${h[0]}" cy="${h[1]}" r="26" fill="#fff" stroke="#f59e0b" stroke-width="4" opacity=".95"/><text x="${h[0]}" y="${h[1] + 10}" font-size="28" text-anchor="middle">${h[2]}</text></g>`).join('') + `<text x="400" y="30" font-size="16" fill="#234" text-anchor="middle" font-weight="700">${ENV[envK].n} — المس الأيقونات لتعرف أين تظهر الفيزياء حولنا</text>`;
            $('#sv').innerHTML = s; if (fr++ % 10 == 0) ui(); requestAnimationFrame(loop)
        }
        load('speed'); requestAnimationFrame(loop);
    </script>
</body>

</html>
