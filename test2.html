<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0d1620">
    <title>مختبر الفيزياء الافتراضي — الأول المتوسط</title>
<title>مختبر الدوائر الكهربائية</title>

  <script src="node_modules/chart.js/dist/chart.umd.js"></script>    <style>
        :root {
            --bg: #e9eef4;
            --pn: #fff;
            --ln: #d3dbe4;
            --tx: #16202a;
            --mu: #586a7a;
            --bt: #e4ebf2;
            --bh: #d2dde9;
            --in: #f1f5f9;
            --ac: #9a5b00;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0d1620;
                --pn: #111b26;
                --ln: #2a3b4c;
                --tx: #e3ecf3;
                --mu: #9fb4c7;
                --bt: #22364a;
                --bh: #2d4b68;
                --in: #0a1119;
                --ac: #ffc94d
            }
        }

        :root[data-theme="dark"] {
            --bg: #0d1620;
            --pn: #111b26;
            --ln: #2a3b4c;
            --tx: #e3ecf3;
            --mu: #9fb4c7;
            --bt: #22364a;
            --bh: #2d4b68;
            --in: #0a1119;
            --ac: #ffc94d
        }

        * {
            box-sizing: border-box
        }

        html {
            background: var(--bg);
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        html,
        body {
            height: 100%
        }

        body {
            margin: 0;
            font-family: Cairo, sans-serif;
            background: var(--bg);
            color: var(--tx);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent
        }

        header {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 8px 12px;
            background: var(--pn);
            border-bottom: 1px solid var(--ln);
            flex-wrap: wrap
        }

        header h1 {
            font-size: 17px;
            margin: 0 8px 0 0;
            color: var(--ac)
        }

        #tools {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        button,
        select,
        input,
        textarea {
            font: inherit
        }

        button,
        select {
            background: var(--bt);
            color: var(--tx);
            border: 1px solid var(--ln);
            border-radius: 8px;
            padding: 5px 11px;
            cursor: pointer;
            touch-action: manipulation
        }

        button:hover {
            background: var(--bh)
        }

        button.on {
            background: #1c8a4e;
            border-color: #2fbf74;
            color: #fff
        }

        #nav {
            display: none
        }

        main {
            flex: 1;
            display: flex;
            min-height: 0;
            position: relative
        }

        #pal {
            width: 150px;
            overflow: auto;
            padding: 8px;
            background: var(--pn);
            border-left: 1px solid var(--ln)
        }

        .pi {
            background: var(--in);
            border: 2px solid var(--ln);
            border-radius: 8px;
            margin-bottom: 7px;
            padding: 3px;
            text-align: center;
            font-size: 12px;
            cursor: pointer
        }

        .pi.sel {
            border-color: #4ea8ff
        }

        .pi svg {
            width: 100%;
            height: 52px;
            display: block
        }

        #stg {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            position: relative
        }

        #sv {
            flex: 1;
            min-height: 0;
            width: 100%;
            background: var(--bg)
        }

        #vt {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 5;
            display: flex;
            gap: 6px
        }

        #acts {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding: 6px 8px;
            background: var(--pn);
            border-top: 1px solid var(--ln);
            min-height: 46px;
            align-items: center
        }

        #hcard {
            position: absolute;
            left: 8px;
            right: 8px;
            bottom: 60px;
            z-index: 6;
            background: var(--pn);
            border: 1px solid var(--ln);
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 6px 24px #0006;
            display: none;
            font-size: 14px;
            line-height: 1.7
        }

        #hcard.show {
            display: block
        }

        #side {
            width: 390px;
            overflow: auto;
            padding: 10px;
            background: var(--pn);
            border-right: 1px solid var(--ln)
        }

        #side h3 {
            margin: 4px 0 8px;
            font-size: 15px;
            color: var(--ac)
        }

        .rd {
            margin: 8px 0;
            padding: 8px;
            background: var(--in);
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.75
        }

        .rd ol,
        .rd ul {
            margin: 4px 0;
            padding-right: 20px
        }

        .fm {
            direction: ltr;
            text-align: left;
            font-size: 13px;
            color: var(--mu)
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--mu);
            margin-top: 8px
        }

        #side input[type=number],
        #side input[type=text],
        #side select,
        #side textarea {
            width: 100%;
            background: var(--in);
            color: var(--tx);
            border: 1px solid var(--ln);
            border-radius: 6px;
            padding: 4px 6px
        }

        input[type=range] {
            width: 100%
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 6px
        }

        th,
        td {
            padding: 4px;
            border-bottom: 1px solid var(--ln);
            text-align: center
        }

        #tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 8px
        }

        #tabs button {
            flex: 1;
            padding: 5px 2px;
            font-size: 13px
        }

        .sec {
            display: none
        }

        body[data-tab=e] .sec[data-s=e],
        body[data-tab=m] .sec[data-s=m],
        body[data-tab=c] .sec[data-s=c],
        body[data-tab=t] .sec[data-s=t] {
            display: block
        }

        .hs {
            animation: pl 1.6s infinite
        }

        @keyframes pl {
            50% {
                opacity: .6
            }
        }

        #md {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #000b;
            display: none;
            align-items: center;
            justify-content: center;
            padding: calc(env(safe-area-inset-top, 0px) + 8px) 8px 8px
        }

        #md.show {
            display: flex
        }

        #md .box {
            background: var(--pn);
            border: 1px solid var(--ln);
            border-radius: 14px;
            max-width: 900px;
            width: 100%;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        #md .hd {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid var(--ln)
        }

        #mdb {
            padding: 12px;
            overflow: auto
        }

        .paper {
            background: #fff;
            color: #111;
            padding: 18px;
            border-radius: 8px;
            line-height: 1.8;
            font-size: 14px
        }

        .paper h2 {
            margin: 0 0 4px;
            color: #0b3d6b
        }

        .paper h3 {
            margin: 12px 0 4px;
            color: #0b3d6b;
            border-bottom: 2px solid #0b3d6b
        }

        .paper table {
            font-size: 12.5px
        }

        .paper th,
        .paper td {
            border: 1px solid #aab;
            color: #111
        }

        .paper th {
            background: #e6eefb
        }

        @media print {
            body>*:not(#md) {
                display: none !important
            }

            html,
            body {
                height: auto;
                overflow: visible;
                background: #fff
            }

            #md {
                position: static;
                display: block;
                background: none;
                padding: 0
            }

            #md .box {
                border: 0;
                max-height: none;
                overflow: visible
            }

            #md .hd,
            .noprint {
                display: none !important
            }

            #mdb {
                padding: 0;
                overflow: visible
            }
        }

        @media(pointer:coarse) {

            button,
            select {
                min-height: 40px
            }
        }

        @media(max-width:899px) {
            header {
                padding: 6px 10px
            }

            header h1 {
                font-size: 15px
            }

            #st {
                order: 9;
                width: 100%;
                font-size: 12px;
                color: var(--mu)
            }

            #tools {
                display: none;
                position: fixed;
                top: calc(env(safe-area-inset-top, 0px) + 52px);
                left: 8px;
                right: 8px;
                z-index: 50;
                background: var(--pn);
                border: 1px solid var(--ln);
                border-radius: 14px;
                padding: 10px;
                box-shadow: 0 8px 30px #0008;
                grid-template-columns: 1fr 1fr
            }

            body.s-menu #tools {
                display: grid
            }

            #tools select,
            #tools button {
                width: 100%
            }

            #pal,
            #side {
                position: fixed;
                left: 0;
                right: 0;
                bottom: calc(58px + env(safe-area-inset-bottom, 0px));
                width: auto;
                border: 0;
                border-top: 1px solid var(--ln);
                z-index: 30;
                transform: translateY(130%);
                visibility: hidden;
                transition: transform .2s, visibility .2s;
                box-shadow: 0 -6px 24px #0007
            }

            #pal {
                display: flex;
                gap: 8px;
                overflow-x: auto;
                padding: 8px
            }

            .pi {
                flex: 0 0 96px;
                margin: 0
            }

            #side {
                max-height: 60%;
                border-radius: 16px 16px 0 0
            }

            body.s-pal #pal,
            body.s-side #side {
                transform: none;
                visibility: visible
            }

            #nav {
                display: flex;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                z-index: 40;
                background: var(--pn);
                border-top: 1px solid var(--ln);
                padding-bottom: env(safe-area-inset-bottom, 0px)
            }

            #nav button {
                flex: 1;
                height: 58px;
                border: 0;
                border-radius: 0;
                background: none;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                font-size: 20px;
                line-height: 1.2
            }

            #nav button span {
                font-size: 11px;
                color: var(--mu)
            }

            #nav button.act span {
                color: var(--ac);
                font-weight: 700
            }

            #hcard {
                bottom: calc(120px + env(safe-area-inset-bottom, 0px))
            }

            #acts {
                margin-bottom: calc(58px + env(safe-area-inset-bottom, 0px))
            }
        }
    </style>
</head>

                    const cx = 300, cy = 340, flask = (t) => `<path d="M${cx - 14} ${t}V${cy - 34}L${cx - 46} ${cy + 14}Q${cx - 52} ${cy + 52} ${cx} ${cy + 52}Q${cx + 52} ${cy + 52} ${cx + 46} ${cy + 14}L${cx + 14} ${cy - 34}V${t}`; let s = R(130, 270, 340, 150, hcol((S.Tc - 5) / 90), 'opacity=".4" stroke="#456" stroke-width="3"') + Tx(150, 300, 'حمام مائي', 12, '#456', 'start');
                    if (+P.mode == 0) {
                        const L = LIQ[P.lq], ry = this.rise(), ly = cl(240 - ry * 18 - 30, 60, 210); s += R(cx - 12, 60, 24, 150, '#f2f9ff', 'stroke="#456" stroke-width="2" opacity=".9"') + `<path d="${flask(215).slice(0)}Z" fill="${L.col}" opacity=".85"/>` + R(cx - 10, ly, 20, 210 - ly, L.col, 'opacity=".9"') + `<path d="${flask(210)}" fill="none" stroke="#456" stroke-width="3"/>`;
                        for (let i = 0; i <= 10; i++)s += Ln(cx + 12, 240 - i * 18 - 30, cx + 22, 240 - i * 18 - 30, '#456', 1) + (i % 2 == 0 ? Tx(cx + 36, 240 - i * 18 - 26, i, 10, '#456') : '');
                        s += Tx(560, 140, 'ارتفاع السائل عن مستواه الأصلي', 12, '#456', 'end') + Tx(560, 170, f1(ry, 2) + ' cm', 22, '#0a7a3a', 'end', 'font-weight="700"') + Tx(560, 200, L.n + ' (β = ' + L.b + '×10⁻³ /°C)', 13, '#456', 'end')
                    }
                    else { const ratio = (273 + S.Tc) / 293, Vb = Math.max(2, 5 + 250 * (ratio - 1)), r = 14 * Math.cbrt(3 * Vb / (4 * 3.1416)); s += `<path d="${flask(210)}" fill="#f2f9ff" stroke="#456" stroke-width="3"/>` + R(cx - 18, 205, 36, 14, '#9ab') + `<ellipse cx="${cx}" cy="${205 - r}" rx="${r}" ry="${r * 1.1}" fill="#ff6b8a" stroke="#a02" stroke-width="2" opacity=".92"/>` + Tx(560, 140, 'حجم الغاز النسبي V/V₀', 12, '#456', 'end') + Tx(560, 170, f1(ratio, 3), 22, '#0a7a3a', 'end', 'font-weight="700"') + Tx(560, 200, 'حجم البالون ≈ ' + f1(Vb, 0) + ' cm³', 13, '#456', 'end') }
                    return s + therm(700, 230, 150, S.Tc, 0, 100) + Tx(700, 215, 'الحمام', 12, '#456')
                },
                read() { const o = [['حرارة الحمام', f1(S.Tc, 1) + ' °C'], ['ΔT', f1(S.Tc - 20, 1) + ' °C']]; if (+P.mode == 0) o.push(['ارتفاع السائل', f1(this.rise(), 2) + ' cm'], ['السائل', LIQ[P.lq].n]); else { const r = (273 + S.Tc) / 293; o.push(['V/V₀', f1(r, 3)], ['ΔV%', f1((r - 1) * 100, 1) + '%']) } return o }, rh: ['الوضع', 'T °C', 'النتيجة'], rec() { return [[+P.mode == 0 ? 'سائل: ' + LIQ[P.lq].n : 'غاز', f1(S.Tc, 1), +P.mode == 0 ? f1(this.rise(), 2) + ' cm' : 'V/V₀=' + f1((273 + S.Tc) / 293, 3)]] }
            }
        ];
        /* ===== الواجهة ===== */
        function load(id) { X = EX.find(e => e.id == id); P = {}; X.params.forEach(p => P[p.k] = p.v); S = {}; X.init && X.init(); rows[id] = rows[id] || []; tool = null; $('#ex').value = id; build() }
        function build() { explain(); ctl(); acts(); pal(); mt(); recT(); $('#nt').value = notes[X.id] || '' }
        function envLinks() { const o = []; Object.entries(ENV).forEach(([k, e]) => e.hs.forEach(h => { if (h[5] == X.id) o.push(`<button data-go="${k}">${h[2]} ${h[3]} — ${e.n}</button>`) })); return o.join(' ') }
        function explain() {
            let h = ''; if (tool != null) { const t = X.tools[tool]; h += `<div class="rd" style="border-right:4px solid #4ea8ff"><b>🧰 ${t[0]}</b><br>الفائدة: ${t[2]}<br>طريقة الاستعمال: ${t[3]}</div>` }
            h += `<h3>${X.n}</h3><div class="rd"><b>${CH[X.ch]}</b></div><div class="rd"><b>🎯 الهدف:</b> ${X.goal}</div><div class="rd"><b>💡 الفائدة والغرض:</b> ${X.why}</div><div class="rd"><b>🧰 الأدوات:</b> ${X.tools.map(t => t[0]).join('، ')}</div><div class="rd"><b>📝 الطريقة:</b><ol>${X.steps.map(s => `<li>${s}</li>`).join('')}</ol></div><div class="rd"><b>📏 القياسات المطلوبة:</b><ul>${X.meas.map(s => `<li>${s}</li>`).join('')}</ul></div><div class="rd"><b>📐 القانون:</b><div class="fm">${X.law}</div></div><div class="rd"><b>✅ الاستنتاج:</b> ${X.concl}</div><div class="rd"><b>🌍 أين نراها في حياتنا؟</b><br>${envLinks() || '—'}</div>`; $('#s-e').innerHTML = h
        }
        function ctl() { let h = '<div class="rd">حرّك المنزلقات أو غيّر القوائم لتعديل التجربة وأدواتها.</div>'; X.params.forEach(p => { const v = P[p.k]; h += `<label>${p.l}${p.u ? ' (' + p.u + ')' : ''}</label>`; if (p.o) { const o = typeof p.o == 'function' ? p.o() : p.o; h += `<select data-k="${p.k}">${o.map(([a, b]) => `<option value="${a}" ${a == v ? 'selected' : ''}>${b}</option>`).join('')}</select>` } else h += `<input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${v}" data-k="${p.k}"><input type="number" step="any" value="${v}" data-k="${p.k}">` }); $('#s-c').innerHTML = h }
        function syncC() { $$('#s-c [data-k]').forEach(o => { if (o !== document.activeElement) o.value = P[o.dataset.k] }) }
        $('#s-c').addEventListener('input', e => { const el = e.target, k = el.dataset.k; if (!k) return; let v = el.value; v = /^-?[\d.]+$/.test(v) ? +v : v; P[k] = v; X.chg && X.chg(k); $$('#s-c [data-k="' + k + '"]').forEach(o => { if (o !== el) o.value = v }); syncC() });
        function acts() { $('#acts').innerHTML = (X.acts || []).map((a, i) => `<button data-a="${i}" class="${a[2] && S[a[2]] ? 'on' : ''}">${a[0]}</button>`).join('') || '<span style="font-size:12px;color:var(--mu)">استعمل «التحكم» لتعديل التجربة.</span>' }
        $('#acts').addEventListener('click', e => { const i = e.target.dataset.a; if (i == null) return; X.acts[i][1](); acts() });
        function pal() { $('#pal').innerHTML = X.tools.map((t, i) => `<div class="pi ${tool == i ? 'sel' : ''}" data-i="${i}">${ico(t[1])}${t[0]}</div>`).join('') }
        $('#pal').addEventListener('click', e => { const d = e.target.closest('.pi'); if (!d) return; tool = +d.dataset.i; explain(); pal(); document.body.dataset.tab = 'e'; if (innerWidth < 900) { closeSheets(); document.body.classList.add('s-side'); $$('#nav button')[1].classList.add('act') } });
        function mt() { $('#mt').innerHTML = '<table><tr><th>المادة</th><th>ρ g/cm³</th><th>k</th><th>α</th></tr>' + Object.entries(MAT).map(([k, m]) => `<tr><td>${m.n}</td>${['rho', 'k', 'a'].map(f => `<td><input type="number" step="any" value="${m[f]}" data-m="${k}" data-f="${f}"></td>`).join('')}</tr>`).join('') + '</table><label>السوائل (الكثافة)</label><table>' + Object.entries(LIQ).map(([k, m]) => `<tr><td>${m.n}</td><td><input type="number" step="any" value="${m.rho}" data-l="${k}"></td></tr>`).join('') + '</table>' }
        $('#mt').addEventListener('input', e => { const d = e.target.dataset, v = parseFloat(e.target.value); if (!(v > 0)) return; if (d.m) MAT[d.m][d.f] = v; if (d.l) LIQ[d.l].rho = v });
        $('#ma').onclick = () => { const n = $('#mn').value.trim(), r = parseFloat($('#md2').value); if (!n || !(r > 0)) return; const k = 'c' + Date.now(); MAT[k] = { n, rho: r, col: '#' + Math.floor(Math.random() * 0x666666 + 0x555555).toString(16).padStart(6, '5'), k: 1, a: 10 }; $('#mn').value = ''; mt(); ctl() };
        function recT() { const r = rows[X.id] || []; $('#rows').innerHTML = r.length ? `<table><tr>${X.rh.map(h => `<th>${h}</th>`).join('')}</tr>${r.map(x => `<tr>${x.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table>` : '<div class="rd">لا قراءات مسجّلة بعد.</div>' }
        $('#rc').onclick = () => { rows[X.id].push(...X.rec()); recT() }; $('#rcx').onclick = () => { rows[X.id] = []; recT() }; $('#nt').oninput = e => notes[X.id] = e.target.value;
        function ui() { $('#rdg').innerHTML = '<table>' + X.read().map(([a, b]) => `<tr><td>${a}</td><td><b>${b}</b></td></tr>`).join('') + '</table>'; $('#st').textContent = (run ? '● يعمل' : '○ متوقف') + ' — ' + ENV[envK].n; syncC(); acts() }
        function closeSheets() { document.body.classList.remove('s-pal', 's-side', 's-menu'); $$('#nav button').forEach(b => b.classList.remove('act')) }
        $$('#nav [data-n]').forEach(b => b.onclick = () => { const k = 's-' + b.dataset.n, on = document.body.classList.contains(k); closeSheets(); if (!on) { document.body.classList.add(k); b.classList.add('act') } });
        $$('#tabs [data-t]').forEach(b => b.onclick = () => document.body.dataset.tab = b.dataset.t);
        $('#ex').innerHTML = [1, 2, 3].map(c => `<optgroup label="${CH[c]}">` + EX.filter(e => e.ch == c).map(e => `<option value="${e.id}">${e.n}</option>`).join('') + '</optgroup>').join('');
        $('#ex').onchange = e => { load(e.target.value); view = 'exp'; vt(); closeSheets() };
        $('#ev').innerHTML = Object.entries(ENV).map(([k, e]) => `<option value="${k}">${e.n}</option>`).join(''); $('#ev').onchange = e => { envK = e.target.value; hot = null; $('#hcard').classList.remove('show'); closeSheets() };
        $('#sp').onchange = e => spd = +e.target.value;
        $('#run').onclick = () => { run = !run; $('#run').textContent = run ? '⏸ إيقاف' : '▶ تشغيل'; $('#run').classList.toggle('on', run) };
        $('#rst').onclick = () => load(X.id);
        function vt() { $$('#vt button').forEach(b => b.classList.toggle('on', b.dataset.v == view)); $('#hcard').classList.remove('show') }
        $$('#vt button').forEach(b => b.onclick = () => { view = b.dataset.v; vt() });
        $('#s-e').addEventListener('click', e => { const g = e.target.dataset.go; if (g) { envK = g; $('#ev').value = g; view = 'env'; vt(); closeSheets() } });
        $('#sv').addEventListener('pointerdown', e => { const g = e.target.closest('[data-h]'); if (!g) return; const h = ENV[envK].hs[+g.dataset.h], ex = EX.find(x => x.id == h[5]); hot = h; $('#hcard').innerHTML = `<b>${h[2]} ${h[3]}</b><br>${h[4]}<br><button id="hg">🔬 جرّب: ${ex.n}</button> <button id="hx">✕</button>`; $('#hcard').classList.add('show') });
        $('#hcard').addEventListener('click', e => { if (e.target.id == 'hx') $('#hcard').classList.remove('show'); if (e.target.id == 'hg' && hot) { load(hot[5]); view = 'exp'; vt(); closeSheets() } });
        function modal(t, h) { $('#mdt').textContent = t; $('#mdb').innerHTML = h; $('#md').classList.add('show') } $('#mdx').onclick = () => $('#md').classList.remove('show');
        $('#rp').onclick = () => { closeSheets(); const r = rows[X.id] || []; modal('📄 تقرير التجربة', `<div class="noprint"><button onclick="window.print()">🖨 طباعة / حفظ PDF</button> <span style="font-size:12px;color:var(--mu)">يمكنك تعديل النص داخل الورقة البيضاء قبل الطباعة.</span></div><div class="paper" contenteditable="true"><h2>${X.n}</h2><div>${CH[X.ch]} — الطالب: ............ الصف: ......... التاريخ: ${new Date().toLocaleDateString('ar-IQ')}</div><h3>الهدف</h3>${X.goal}<h3>الفائدة والغرض</h3>${X.why}<h3>الأدوات</h3>${X.tools.map(t => t[0] + ': ' + t[2]).join('<br>')}<h3>الطريقة</h3><ol>${X.steps.map(s => `<li>${s}</li>`).join('')}</ol><h3>القانون</h3><div dir="ltr">${X.law}</div><h3>القياسات والنتائج</h3>${r.length ? `<table><tr>${X.rh.map(h => `<th>${h}</th>`).join('')}</tr>${r.map(x => `<tr>${x.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table>` : '<p>لم تُسجَّل قراءات.</p>'}<h3>القراءات الحالية</h3><table>${X.read().map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table><h3>الاستنتاج</h3>${notes[X.id] || X.concl}</div>`) };
        /* ===== الحلقة الرئيسية ===== */
        let last = performance.now();
        function loop(now) {
            const dt = Math.min(.05, (now - last) / 1000 || .016); last = now; let s;
            if (view == 'exp') { if (run && X.tick) X.tick(dt, dt * spd); s = ENV[envK].d() + R(10, 10, 780, 460, '#f6f9fc', 'rx="18" opacity=".92"') + X.draw() }
            else s = ENV[envK].d() + ENV[envK].hs.map((h, i) => `<g class="hs" data-h="${i}" style="cursor:pointer"><circle cx="${h[0]}" cy="${h[1]}" r="26" fill="#fff" stroke="#f59e0b" stroke-width="4" opacity=".95"/><text x="${h[0]}" y="${h[1] + 10}" font-size="28" text-anchor="middle">${h[2]}</text></g>`).join('') + `<text x="400" y="30" font-size="16" fill="#234" text-anchor="middle" font-weight="700">${ENV[envK].n} — المس الأيقونات لتعرف أين تظهر الفيزياء حولنا</text>`;
            $('#sv').innerHTML = s; if (fr++ % 10 == 0) ui(); requestAnimationFrame(loop)
        }
        load('states'); requestAnimationFrame(loop);
    </script>
</body>
